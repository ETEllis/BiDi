  <text x="940" y="354" text-anchor="middle" fill="#5c6966" font-family="Verdana,sans-serif" font-size="11" letter-spacing="2">SYSTEM</text>
  <text x="1130" y="333" text-anchor="middle" fill="#293634" font-family="Georgia,serif" font-size="30">CDC</text>
  <text x="1130" y="354" text-anchor="middle" fill="#5c6966" font-family="Verdana,sans-serif" font-size="11" letter-spacing="2">CALCULUS</text>
