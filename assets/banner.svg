<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title description">
  <title id="title">BiDi and CDC: related marks for system and calculus</title>
  <desc id="description">A transformation should account for itself. BiDi's paired paths surround an open center; CDC's ordered trit path stays above its baseline.</desc>
  <rect width="1280" height="500" fill="#eeeae1"/>
  <g stroke="#c4ccc4" stroke-width="1">
    <path d="M64 82H1216M64 432H1216M850 82V432M950 82V432M1050 82V432M1150 82V432M850 182H1216M850 282H1216M850 382H1216"/>
  </g>
  <text x="64" y="53" fill="#293634" font-family="Verdana,sans-serif" font-size="15" letter-spacing="4">ETELLIS / BIDI</text>
  <text x="1198" y="53" text-anchor="end" fill="#5c6966" font-family="Verdana,sans-serif" font-size="13" letter-spacing="2">SYSTEM / CALCULUS / EVIDENCE</text>
  <text x="60" y="179" fill="#293634" font-family="Georgia,serif" font-size="70" letter-spacing="-3">A transformation</text>
  <text x="60" y="262" fill="#293634" font-family="Georgia,serif" font-size="70" letter-spacing="-3">should account</text>
  <rect x="63" y="326" width="264" height="19" fill="#c5d2bc"/>
  <text x="60" y="345" fill="#293634" font-family="Georgia,serif" font-size="70" font-style="italic" letter-spacing="-3">for itself.</text>
  <g transform="translate(870 151) scale(1.25)">
    <rect width="112" height="112" rx="2" fill="#293634"/>
    <path d="M24 22C48 21 59 88 88 90" fill="none" stroke="#eeeae1" stroke-width="9" stroke-linecap="round"/>
    <path d="M88 22C64 21 53 88 24 90" fill="none" stroke="#abc3ad" stroke-width="7" stroke-linecap="round"/>
    <circle cx="56" cy="56" r="11" fill="#293634"/>
    <g fill="#d4ee64" stroke="#293634" stroke-width="2">
      <circle cx="24" cy="22" r="5"/><circle cx="88" cy="22" r="5"/>
      <circle cx="24" cy="90" r="5"/><circle cx="88" cy="90" r="5"/>
    </g>
  </g>
  <path d="M1022 221H1048M1039 212L1048 221L1039 230" fill="none" stroke="#293634" stroke-width="2"/>
  <g transform="translate(1060 151) scale(1.25)">
    <rect width="112" height="112" rx="2" fill="#c5d2bc"/>
    <path d="M18 80H94" fill="none" stroke="#748d7c" stroke-width="2" stroke-dasharray="2 5"/>
