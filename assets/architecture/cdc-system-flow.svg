<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">BiDi CDC executable system flow</title>
  <desc id="desc">A layered flow from canonical CDC source through parsing, FLOW COMMIT and NEST semantics, guarded durable storage, package lifecycle, evidence, and the Memory Manifold and Superposition adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101b2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}
      .lane{fill:#0d1b2d;stroke:#26364d;stroke-width:1.5}
      .laneTitle{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#7dd3fc;letter-spacing:1.6px}
      .box{fill:#13243a;stroke:#36516d;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .boxStrong{fill:url(#cyan);stroke:#99f6e4;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .boxAlt{fill:url(#violet);stroke:#ddd6fe;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .label{font:650 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc;text-anchor:middle}
      .small{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1;text-anchor:middle}
      .dark{fill:#07111f}
      .line{fill:none;stroke:#7dd3fc;stroke-width:2.4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#a78bfa;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
      .note{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}
    </style>
  </defs>

  <rect width="1440" height="940" fill="url(#bg)"/>
  <text x="72" y="68" class="title">BiDi / CDC — executable coherence path</text>
  <text x="72" y="98" class="sub">One canonical source, one guarded mutation boundary, replayable evidence at every durable transition.</text>

  <rect x="60" y="135" width="1320" height="150" rx="22" class="lane"/>
  <text x="86" y="164" class="laneTitle">LANGUAGE</text>
  <rect x="100" y="185" width="210" height="68" class="box"/>
  <text x="205" y="214" class="label">.cdc source</text>
  <text x="205" y="236" class="small">canonical declarations</text>
  <rect x="390" y="185" width="220" height="68" class="box"/>
  <text x="500" y="214" class="label">Grammar-1 frontend</text>
  <text x="500" y="236" class="small">diagnose · parse · canon</text>
  <rect x="690" y="185" width="200" height="68" class="boxStrong"/>
  <text x="790" y="214" class="label dark">Typed AST</text>
  <text x="790" y="236" class="small dark">ABI 1.4</text>
  <rect x="1030" y="185" width="270" height="68" class="box"/>
  <text x="1165" y="214" class="label">Frozen oracle</text>
  <text x="1165" y="236" class="small">CI-only differential</text>
  <path d="M310 219 H390" class="line"/>
  <path d="M610 219 H690" class="line"/>
  <path d="M1030 219 H920 Q900 219 890 210" class="dash"/>

  <rect x="60" y="315" width="1320" height="200" rx="22" class="lane"/>
  <text x="86" y="344" class="laneTitle">SEMANTIC KERNEL</text>
  <rect x="95" y="380" width="210" height="84" class="boxAlt"/>
  <text x="200" y="413" class="label">FLOW(d)</text>
  <text x="200" y="437" class="small">continuous evolution</text>
  <rect x="380" y="365" width="250" height="114" class="boxStrong"/>
  <text x="505" y="407" class="label dark">Live Runtime</text>
  <text x="505" y="431" class="small dark">state · trace · evidence</text>
  <text x="505" y="451" class="small dark">one fused execution</text>
  <rect x="705" y="380" width="210" height="84" class="boxAlt"/>
  <text x="810" y="413" class="label">NEST(frame)</text>
  <text x="810" y="437" class="small">reference-frame coupling</text>
  <rect x="990" y="365" width="310" height="114" class="boxStrong"/>
  <text x="1145" y="407" class="label dark">COMMIT</text>
  <text x="1145" y="431" class="small dark">guarded ternary closure</text>
  <text x="1145" y="451" class="small dark">COMMIT · HOLD · NEST · FAIL</text>
  <path d="M305 422 H380" class="line"/>
  <path d="M630 422 H705" class="line"/>
  <path d="M915 422 H990" class="line"/>
  <path d="M690 253 V338 Q690 365 630 385" class="line"/>
  <path d="M990 457 H950 Q930 457 930 492 H630 Q610 492 610 475" class="dash"/>

  <rect x="60" y="545" width="860" height="270" rx="22" class="lane"/>
  <text x="86" y="574" class="laneTitle">DURABLE CLOSURE</text>
  <rect x="100" y="620" width="210" height="82" class="box"/>
  <text x="205" y="652" class="label">Authority + fence</text>
  <text x="205" y="676" class="small">only after COMMIT</text>
  <rect x="370" y="620" width="210" height="82" class="boxStrong"/>
  <text x="475" y="652" class="label dark">Sealed transaction</text>
  <text x="475" y="676" class="small dark">decision + effects</text>
  <rect x="640" y="603" width="220" height="116" class="boxAlt"/>
  <text x="750" y="643" class="label">cdc_store</text>
  <text x="750" y="667" class="small">recover · replay · attest</text>
  <text x="750" y="687" class="small">snapshot · compact · fence</text>
  <rect x="220" y="743" width="260" height="46" class="box"/>
  <text x="350" y="772" class="label">typed receipt</text>
  <rect x="535" y="743" width="260" height="46" class="box"/>
  <text x="665" y="772" class="label">closure witness</text>
  <path d="M1145 479 V555 H205 V620" class="line"/>
  <path d="M310 661 H370" class="line"/>
  <path d="M580 661 H640" class="line"/>
  <path d="M700 719 L480 751" class="line"/>
  <path d="M775 719 L720 743" class="line"/>

  <rect x="950" y="545" width="430" height="270" rx="22" class="lane"/>
  <text x="976" y="574" class="laneTitle">PACKAGE + EXTENSION</text>
  <rect x="985" y="610" width="110" height="66" class="box"/>
  <text x="1040" y="638" class="label">build</text>
  <text x="1040" y="659" class="small">bundle</text>
  <rect x="1125" y="610" width="110" height="66" class="box"/>
  <text x="1180" y="638" class="label">install</text>
  <text x="1180" y="659" class="small">journal</text>
  <rect x="1265" y="610" width="80" height="66" class="box"/>
  <text x="1305" y="638" class="label">x</text>
  <text x="1305" y="659" class="small">local</text>
  <path d="M1095 643 H1125" class="line"/>
  <path d="M1235 643 H1265" class="line"/>
  <rect x="985" y="718" width="360" height="70" class="boxAlt"/>
  <text x="1165" y="747" class="label">RFTC control plane</text>
  <text x="1165" y="770" class="small">frame · topology · authority · transport</text>
  <path d="M1180 676 V718" class="dash"/>

  <rect x="180" y="855" width="390" height="58" class="boxStrong"/>
  <text x="375" y="883" class="label dark">Memory Manifold</text>
  <text x="375" y="902" class="small dark">replayable memory adapter</text>
  <rect x="870" y="855" width="390" height="58" class="boxStrong"/>
  <text x="1065" y="883" class="label dark">Superposition</text>
  <text x="1065" y="902" class="small dark">distributed state + guarded execution</text>
  <path d="M665 789 V827 H375 V855" class="dash"/>
  <path d="M1145 515 V827 H1065 V855" class="dash"/>

  <text x="72" y="928" class="note">Definition → construction → counterexample → execution → integration → field evidence</text>
</svg>
