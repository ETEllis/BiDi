name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Native CDC, bridge, reducer, formal proofs, and paper
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native linear algebra backend
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev

      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up OCaml/opam for Rocq
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"

      - name: Install Rocq/Coq 9.1.1
        run: |
          opam update
          opam install -y coq=9.1.1
          eval "$(opam env)"
          echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.16.9"

      - name: Tool versions
        run: |
          python3 --version
          cc --version
          lean --version | grep "4.31.0"
          coqc --version | grep "9.1.1"
          tectonic --version | grep "0.16.9"

      - name: Run full verification gate
        run: ./scripts/verify.sh --require-formal

  studio:
    name: CDC Studio (macOS) builds and passes its tests
    runs-on: macos-14
    timeout-minutes: 45

    # 2026-07-28 review, finding 3. The Linux guard in verify_ui.sh is
    # correct as a platform guard — the Ubuntu runner has a swift binary but
    # no SwiftUI — but it was the ONLY required UI check, so a product
    # surface that did not compile reached a green PR. This lane is the
    # compiler of record for the macOS app and is required, not optional.
    #
    # Second 2026-07-28 review, finding 1: this lane ALSO runs the full
    # native suite. Until it did, a BSD-vs-GNU divergence (padded `wc`
    # output compared as a string) meant the complete suite failed on a
    # real Mac while both GitHub lanes stayed green — the macOS lane
    # compiled Swift only, and the Linux lane never sees BSD userland.
    # Formal proofs (Lean/Rocq) and the paper stay Linux-only; verify.sh
    # skips missing provers by design, and --require-formal is the Linux
    # lane's job.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Toolchain version
        run: |
          swift --version
          cc --version
          python3 --version

      - name: Run full verification gate (native suite, BSD userland)
        run: ./scripts/verify.sh

      - name: Build CDC Studio
        working-directory: ui/macos/CDCStudio
        run: swift build

      - name: Run CDC Studio tests
        working-directory: ui/macos/CDCStudio
        run: swift test
